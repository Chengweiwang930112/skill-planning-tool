# lint → test → quality gate → build image → scan image → push to ECR → deploy to ECS
#
# GitHub Actions has no stages; a stage here is the jobs that share the same
# `needs`, so they run in parallel and the next stage starts once all of them pass.
#
# Pull requests run the first five stages. Pushes to main run all seven. The quality
# gate and the last two only print what they would do, as there is no SonarQube
# server and no AWS environment yet. The
# deployment waits for a click: the `production` environment has required
# reviewers (Settings → Environments), so the run pauses at "Review deployments".
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its previous run; runs on main never cancel,
  # and do not wait for each other either (a deployment awaiting approval would
  # otherwise hold up every later run).
  group: ci-cd-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Lint · backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  frontend-lint:
    name: Lint · frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Type check
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npx tsc --noEmit -p tsconfig.spec.json

  # The backend's three test layers, shown together as one group. Unit and component
  # tests replace HTTP and the database by mocks and record their coverage, which is
  # what the quality gate measures and SonarQube sees. Integration tests go through
  # HTTP into a real PostgreSQL; they run so much code at once that their coverage
  # would make it look better than the tests are, so it is not measured.
  backend-test:
    name: Test · backend ${{ matrix.layer }}
    needs: [backend-lint, frontend-lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - layer: unit
            coverage: --cov-fail-under=0
          - layer: component
            coverage: --cov-fail-under=0
          - layer: integration
            coverage: --no-cov
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      COVERAGE_FILE: .coverage.${{ matrix.layer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start PostgreSQL
        if: matrix.layer == 'integration'
        working-directory: .
        run: docker compose up --detach --wait db
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: Migrations match the models
        if: matrix.layer == 'integration'
        run: |
          uv run alembic upgrade head
          uv run alembic check
      # The 80% threshold applies to unit and component tests together, in the quality gate.
      - run: uv run pytest tests/${{ matrix.layer }} ${{ matrix.coverage }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.layer != 'integration'
        with:
          name: backend-coverage-${{ matrix.layer }}
          path: backend/.coverage.${{ matrix.layer }}
          include-hidden-files: true
          if-no-files-found: error

  frontend-test:
    name: Test · frontend
    needs: [backend-lint, frontend-lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/frontend
          if-no-files-found: error
      # The API types are generated from the backend's OpenAPI schema; this fails when
      # an API change was committed without regenerating them.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: API types match the backend
        run: |
          npm run api:types
          git diff --exit-code -- src/app/api

  # Placeholder: with a SonarQube server, the step below would be
  #   - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
  #     env:
  #       SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  #       SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
  # analysing the code and the coverage reports of the test stage as configured in
  # sonar-project.properties, and failing when the quality gate does. The backend's
  # report covers its unit and component tests only.
  quality-gate:
    name: Quality gate · SonarQube
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarQube needs the history to tell new code from old.
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: backend-coverage-*
          path: backend
          merge-multiple: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Coverage of the backend's unit and component tests
        working-directory: backend
        run: |
          uv run coverage combine .coverage.unit .coverage.component
          uv run coverage report --fail-under=80
          uv run coverage xml
          uv run coverage html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov
          if-no-files-found: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/frontend
      - name: Analyse (simulated)
        run: |
          ls -l backend/coverage.xml frontend/coverage/frontend/lcov.info
          echo "Code and coverage analysed by SonarQube, quality gate passed (simulated, nothing was analysed)."

  build-image:
    name: Build · image
    needs: quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: skill-planning
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start it like `make up`, migrations included
        run: docker compose --profile app up --no-build --detach --wait
      - name: Smoke test
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz
          curl --fail --silent --show-error http://127.0.0.1:8080/employees | grep --quiet '<app-root'
          curl --fail --silent --show-error 'http://127.0.0.1:8080/api/v1/employees?page_size=1'
      - name: Container logs
        if: failure()
        run: docker compose --profile app logs
      - name: Save the image for the next stages
        run: docker save skill-planning --output "$RUNNER_TEMP/image.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          if-no-files-found: error

  # Reports the vulnerabilities of every severity in the OS packages and the Python
  # dependencies of the image, in the log, without failing on any of them yet. To
  # make it a gate: --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1.
  scan-image:
    name: Scan · image (Trivy)
    needs: build-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Scan for vulnerabilities
        run: >
          docker run --rm --volume "$RUNNER_TEMP:/scan"
          aquasec/trivy:0.76.2 image --input /scan/image.tar --exit-code 0

  # Placeholder: with an AWS account, this would assume a role via OIDC, log in to
  # ECR and push the scanned image, tagged with the commit SHA.
  push-ecr:
    name: Push · ECR
    needs: scan-image
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Push (simulated)
        run: |
          echo "Image skill-planning:${GITHUB_SHA::7} pushed to ECR (simulated, nothing was pushed)."

  # Placeholder: with an AWS account, this would run `alembic upgrade head` as a
  # one-off ECS task of the new image, then update the service and wait until it is
  # stable; see ADR 0008.
  deploy-ecs:
    name: Deploy · ECS
    needs: push-ecr
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy (simulated)
        run: |
          echo "Image skill-planning:${GITHUB_SHA::7} deployed to ECS (simulated, nothing was deployed)."
