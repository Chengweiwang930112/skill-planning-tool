# SonarQube analysis of the whole repository: the backend (Python) and the frontend
# (TypeScript) as one project. Run by the "Quality gate" job of
# .github/workflows/ci-cd.yml, after the tests that write the coverage reports below.
sonar.projectKey=skill-planning-tool
sonar.projectName=Staff & Skill Planning Tool

sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=frontend/src/**/*.spec.ts
# Specs are tests, and the API types are generated from the backend's OpenAPI schema.
sonar.exclusions=frontend/src/**/*.spec.ts,frontend/src/app/api/schema.ts,frontend/src/app/api/openapi.json

sonar.python.version=3.12
# Unit and component tests only: integration tests run too much code at once to count.
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/frontend/lcov.info

# Wait for the quality gate's verdict, so that a failed gate fails the pipeline.
sonar.qualitygate.wait=true
