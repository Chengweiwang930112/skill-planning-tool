services:
  db: &postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: skills
      POSTGRES_PASSWORD: skills
      POSTGRES_DB: skills
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: while the init scripts run, PostgreSQL only listens on its socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U skills -d skills"]
      interval: 2s
      timeout: 3s
      retries: 15

  # A throwaway database for `make test`: its own port, kept in memory, removed afterwards.
  test-db:
    <<: *postgres
    profiles: [test]
    ports:
      - "5433:5432"
    volumes:
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data

  # The containerised application; only started with `docker compose --profile app up`,
  # while `make start` runs just the database.
  migrate:
    profiles: [app]
    build: .
    image: skill-planning
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_DATABASE_URL: postgresql+psycopg://skills:skills@db:5432/skills
    depends_on:
      db:
        condition: service_healthy

  app:
    profiles: [app]
    build: .
    image: skill-planning
    environment:
      APP_DATABASE_URL: postgresql+psycopg://skills:skills@db:5432/skills
      # The image defaults to production, which hides Swagger UI; show it locally.
      APP_ENVIRONMENT: local
    ports:
      - "8080:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
