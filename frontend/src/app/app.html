<si-application-header class="surface-dark">
  <si-header-brand>
    <a class="application-name" routerLink="/employees">{{ title }}</a>
  </si-header-brand>
  <si-header-actions>
    <button type="button" si-header-selection-item [siHeaderDropdownTriggerFor]="manage">
      Manage
    </button>
  </si-header-actions>
</si-application-header>

<ng-template #manage>
  <si-header-dropdown>
    <a si-header-dropdown-item icon="element-list" routerLink="/skills">Skill catalogue</a>
    <a si-header-dropdown-item icon="element-upload" routerLink="/imports">Import employees</a>
  </si-header-dropdown>
</ng-template>

<main>
  <router-outlet />
</main>
